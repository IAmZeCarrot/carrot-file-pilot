name: Bug report
description: Report reproducible incorrect or unsafe behavior
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the command, expected behavior, and redacted output.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
    validations:
      required: true
  - type: input
    attributes:
      label: Python and operating system
    validations:
      required: true

