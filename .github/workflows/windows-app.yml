name: Build Windows app

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pyinstaller
      - name: Build desktop executable
        run: >-
          pyinstaller
          --name CarrotFilePilot
          --onefile
          --windowed
          --clean
          --paths src
          packaging/windows_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: CarrotFilePilot-Windows
          path: dist/CarrotFilePilot.exe
          if-no-files-found: error
