[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "carrot-file-pilot"
version = "1.1.0"
description = "A safety-first file organizer with a native desktop interface, previews, and undo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "IAmZeCarrot" }]
keywords = ["files", "organizer", "windows", "desktop", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.11,<2", "pytest>=8.3,<9", "ruff>=0.6,<1"]

[project.scripts]
carrot-file-pilot = "carrot_file_pilot.cli:main"

[project.gui-scripts]
carrot-file-pilot-gui = "carrot_file_pilot.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/carrot_file_pilot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
